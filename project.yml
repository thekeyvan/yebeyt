name: Yebeyt
options:
  bundleIdPrefix: com.yebeyt
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fa
  createIntermediateGroups: true
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Yebeyt:
    type: application
    platform: iOS
    sources:
      - path: Yebeyt
        excludes:
          - Yebeyt.entitlements
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: Yebeyt
        INFOPLIST_FILE: Yebeyt/Info.plist
        CODE_SIGN_ENTITLEMENTS: Yebeyt/Yebeyt.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_STRICT_CONCURRENCY: minimal
