<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Beyt · بیت</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&family=Markazi+Text:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;700&family=Noto+Nastaliq+Urdu:wght@400;700&family=Lalezar&display=swap">
<style>
/* Layout: one calm column, one idea per screen. Four tabs, pushed reader, bottom sheets. Lapis ink + saffron, like a miniature painter's palette. */
/* Dark, cinematic: type-art scenes glow out of near-black; one accent the reader picks (saffron by default). */
:root{
  --bg:#0F0F12; --surface:#1A1A1F; --sunk:#25252C; --glass:rgba(30,30,36,.72);
  --ink:#F4F0E8; --muted:#A8A39A; --line:rgba(255,255,255,.09);
  --acc:#F0A24A;
  --lapis:#A9BBFF; --lapis-soft:rgba(169,187,255,.14);
  --saffron:var(--acc); --saffron-ink:#1B1206; --saffron-soft:color-mix(in srgb,var(--acc) 18%,transparent);
  --good:#4CC38A;
  --ui:"Vazirmatn",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --verse-markazi:"Markazi Text","Noto Naskh Arabic","Geeza Pro",serif;
  --verse-naskh:"Noto Naskh Arabic","Geeza Pro","Times New Roman",serif;
  --verse-nastaliq:"Noto Nastaliq Urdu","Noto Naskh Arabic",serif;
  --display:"Lalezar","Vazirmatn",system-ui,sans-serif;
  --verse:"Parastoo",var(--verse-naskh); --vs:1; --vf:1.06; --vlh:1.95;
  --tabh:84px; --r:22px;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.38);
  color-scheme:dark;
}

html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--lapis);outline-offset:2px;border-radius:12px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.f{fill:currentColor;stroke:none}

.app{position:relative;height:100%;max-width:440px;margin:0 auto;overflow:hidden;overflow:clip;background:var(--bg)}
.screen{overflow:hidden;overflow:clip}
@media (min-width:480px){.app{border-inline:1px solid var(--line)}}
.view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.pad{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:14px 120px;display:flex;flex-direction:column;gap:22px}

/* tab bar */
.tabs{position:absolute;right:max(12px,env(safe-area-inset-right,0px));left:calc(max(12px,env(safe-area-inset-left,0px)) + 72px);bottom:12px;height:62px;display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:6px;border-radius:31px;background:var(--glass);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);border:1px solid var(--line);z-index:20;box-shadow:var(--shadow)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:11px;font-weight:500;border-radius:25px;transition:background .25s,color .25s}
.tab svg{width:20px;height:20px}
.tab[aria-selected="true"]{color:var(--acc);background:color-mix(in srgb,var(--acc) 15%,transparent)}
.fab{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:var(--glass);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--line);z-index:20;color:var(--ink);box-shadow:var(--shadow)}

/* type */
.eyebrow{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.h1{font-size:24px;font-weight:600;line-height:1.3;margin:0;text-wrap:balance}
.h2{font-size:18px;font-weight:700;margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.h2 small{font-size:13px;font-weight:500;color:var(--muted)}
.muted{color:var(--muted)}
.verse{font-family:var(--verse);font-size:calc(21px * var(--vs) * var(--vf));line-height:var(--vlh);font-weight:500}
.mis{display:block;transition:color .25s,background .25s;border-radius:8px;padding-inline:4px}
.mis.m2{text-align:left}
.mis.m1{text-align:right}
.meaning{font-size:calc(15px * var(--vs));line-height:1.9;color:var(--muted)}
.ai{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;color:var(--lapis);background:var(--lapis-soft);vertical-align:middle;cursor:help}
.ai svg{width:14px;height:14px;stroke-width:1.6}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.streak{display:inline-flex;align-items:center;gap:6px;background:var(--saffron-soft);color:var(--ink);font-weight:700;font-size:13px;padding:7px 12px;border-radius:99px}
.streak svg{color:var(--saffron);width:18px;height:18px}

/* hero couplet */
.hero{position:relative;background:var(--surface);border-radius:28px;padding:22px 20px 18px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;gap:14px}
.hero::before{content:"";position:absolute;inset:0;background:var(--girih);opacity:.06;pointer-events:none}
.hero .verse{font-size:calc(23px * var(--vs) * var(--vf))}
.reveal{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.reveal>div{overflow:hidden}
.reveal.on{grid-template-rows:1fr}
.reveal .meaning{padding-top:12px;border-top:1px dashed var(--line);margin-top:2px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.who b{color:var(--ink);font-weight:700}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:99px;font-weight:700;font-size:14px;background:var(--sunk);color:var(--ink);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--saffron);color:var(--saffron-ink)}
.btn.ink{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.icon{width:44px;padding:0}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.btn[aria-pressed="true"]{color:var(--saffron)}
.btn[aria-pressed="true"] svg{fill:currentColor}
.grow{flex:1}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * max(18px,env(safe-area-inset-left,0px)));padding-inline:max(18px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 16px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:500;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* list cards */
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:right;width:100%}
.prog{height:6px;border-radius:9px;background:var(--sunk);overflow:hidden}
.prog i{display:block;height:100%;background:var(--saffron);border-radius:9px}
.poets{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * max(18px,env(safe-area-inset-left,0px)));padding-inline:max(18px,env(safe-area-inset-left,0px))}
.poets::-webkit-scrollbar{display:none}
.poet{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:72px;font-size:13px;font-weight:500}
.av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:26px;color:#fff;position:relative;overflow:hidden;background:hsl(var(--h) 55% 42%)}
.av::after{content:"";position:absolute;inset:0;background:var(--girih);opacity:.22}
.av span{position:relative;z-index:1}
.song{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.song:last-child{border-bottom:0}
.song .cov{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--saffron-soft);color:var(--saffron);flex:none}
.song div{min-width:0}
.song b{display:block;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song small{color:var(--muted);font-size:12px}

/* feed */
.feed{scroll-snap-type:y mandatory}
.fcard{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;justify-content:flex-end;padding:84px max(22px,env(safe-area-inset-left,0px)) 112px max(78px,env(safe-area-inset-right,0px));overflow:hidden}
.fcard .bgart{position:absolute;inset:0;background:radial-gradient(120% 70% at 85% 10%,hsl(var(--h) 70% 55% / .16),transparent 60%),radial-gradient(90% 60% at 10% 95%,hsl(calc(var(--h) + 40) 70% 55% / .12),transparent 60%)}
.fcard .bgart::after{content:"";position:absolute;inset:0;background:var(--girih);opacity:.035}
.fcard>*{position:relative}
.fcard .verse{font-size:calc(25px * var(--vs) * var(--vf));line-height:2.05}
.fbody{display:flex;flex-direction:column;gap:18px}
.rail{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:150px;display:flex;flex-direction:column;gap:18px;align-items:center;z-index:2}
.rail button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-weight:500}
.rail .circ{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);color:var(--ink)}
.rail button[aria-pressed="true"] .circ{color:var(--saffron)}
.rail button[aria-pressed="true"] .circ svg{fill:currentColor}
.feedtop{position:absolute;top:0;left:0;right:0;z-index:5;padding:12px 0 18px;background:linear-gradient(var(--bg) 55%,transparent)}
.feedtop .chips{margin:0;padding-inline:max(18px,env(safe-area-inset-left,0px))}
.hint{position:absolute;bottom:88px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}

/* pushed screen */
.screen{position:absolute;inset:0;background:var(--bg);z-index:30;transform:translateX(-104%);transition:transform .38s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.18)}
.screen.on{transform:none}
.sbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px max(12px,env(safe-area-inset-left,0px)) 6px;flex:none}
.sbar .ttl{font-weight:700;font-size:15px;text-align:center;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbody{flex:1;overflow-y:auto}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:14px;padding:4px;gap:4px}
.seg button{height:36px;border-radius:10px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tldr{background:var(--saffron-soft);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px}
.tldr p{margin:0;line-height:1.95;font-size:calc(15px * var(--vs))}
.tldr.clamp p{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cpl{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-bottom:1px solid var(--line);text-align:right;width:100%}
.cpl:last-child{border-bottom:0}
.cpl .meaning{padding-inline:4px}
.mode-orig .cpl .meaning{display:none}
.mode-mean .cpl .verse{display:none}
.mode-mean .cpl .meaning{color:var(--ink);font-size:calc(16px * var(--vs))}
.mis.on{background:var(--saffron-soft);color:var(--ink)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{background:var(--surface);border-radius:16px;padding:12px 14px;min-width:0}
.fact small{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
.fact b{font-weight:700;font-size:14px;line-height:1.6}
.fact.wide{grid-column:1/-1}
.player{flex:none;margin:0 max(12px,env(safe-area-inset-left,0px)) 10px;background:var(--glass);color:var(--ink);border:1px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:22px;padding:10px 12px 10px 14px;display:flex;align-items:center;gap:12px}
.player .pp{width:44px;height:44px;border-radius:50%;background:var(--saffron);color:var(--saffron-ink);display:grid;place-items:center;flex:none}
.player .meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.player .meta b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .bar{height:4px;border-radius:4px;background:color-mix(in srgb,var(--bg) 25%,transparent)}
.player .bar i{display:block;height:100%;width:0;background:var(--saffron);border-radius:4px}
.player .t{font-size:11px;opacity:.75;font-variant-numeric:tabular-nums}
.player .who2{font-size:12px;opacity:.8;text-decoration:underline;text-underline-offset:3px}

/* sheet */
.scrim{position:absolute;inset:0;background:rgba(5,8,20,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;background:var(--bg);border-radius:28px 28px 0 0;max-height:88%;overflow-y:auto;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding:10px max(18px,env(safe-area-inset-left,0px)) 24px}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.sheet .stack{display:flex;flex-direction:column;gap:16px}

/* share card */
.story{width:min(62%,230px);aspect-ratio:9/16;max-width:100%;margin:0 auto;border-radius:22px;padding:22px 16px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.story::after{content:"";position:absolute;inset:0;background:var(--girih);opacity:.08;pointer-events:none}
.story .verse{font-size:calc(15px * var(--vf));line-height:2}
.story .sm{font-size:10.5px;line-height:1.8;opacity:.8}
.story .ft{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:700}
.story .logo{font-family:var(--display);font-size:20px}
.st-lapis{background:#1E3592;color:#FFF4DF}
.st-saffron{background:#E8A23A;color:#2A1A03}
.st-paper{background:#F6F2E9;color:#1A2150}
.st-night{background:#070B1C;color:#E9ECFA}
.sw{display:flex;gap:12px;justify-content:center}
.sw button{width:36px;height:36px;border-radius:50%;border:2px solid transparent;outline:1px solid var(--line)}
.sw button[aria-pressed="true"]{border-color:var(--bg);outline:2px solid var(--ink)}

/* fal */
.falwrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;text-align:center;padding:30px max(22px,env(safe-area-inset-left,0px))}
.falwrap .big{font-size:34px;font-weight:600;line-height:1.3;margin:0}
.hold{--p:0;width:190px;height:190px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--saffron) calc(var(--p) * 1turn),var(--sunk) 0);touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .15s}
.hold:active{transform:scale(.97)}
.hold>span{width:160px;height:160px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--verse);font-size:42px;color:var(--ink);position:relative;overflow:hidden}
.hold>span::after{content:"";position:absolute;inset:0;background:var(--girih);opacity:.08}
.falres{animation:rise .6s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:.0;transform:translateY(24px) scale(.98)}}

/* onboarding */
.onb{position:absolute;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
[hidden]{display:none!important}
.obg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.obg canvas{position:absolute;inset:0;width:100%;height:100%}
.obg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,15,18,.25) 0%,rgba(15,15,18,.45) 45%,var(--bg) 82%)}
.ostage{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;padding:16px max(22px,env(safe-area-inset-left,0px)) 22px max(22px,env(safe-area-inset-right,0px));animation:oin .45s cubic-bezier(.2,.8,.2,1)}
@keyframes oin{from{opacity:0;transform:translateX(-22px)}}
.otop{display:flex;align-items:center;justify-content:space-between;height:44px;flex:none}
.owm{font-family:var(--display);font-size:24px;line-height:1;min-width:64px}
.owm em{font-style:normal;color:var(--acc)}
.oback{background:rgba(255,255,255,.06)}
.oskip{min-width:64px;text-align:left;font-size:14px;color:var(--muted);padding:10px 2px}
.odots{display:flex;gap:6px}
.odots i{width:6px;height:6px;border-radius:9px;background:rgba(255,255,255,.2);transition:width .3s}
.odots i.on{width:20px;background:var(--acc)}
.obody{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:18px;overflow-y:auto;padding:8px 0}
.obody.ostart{justify-content:flex-start;padding-top:14px}
.ohd{display:flex;flex-direction:column;gap:6px}
.ofoot{flex:none;display:flex;flex-direction:column;gap:14px;padding-top:12px}
.ohead{margin:0;font-size:31px;font-weight:600;line-height:1.45;text-wrap:balance;color:var(--ink)}
.ohead.sm{font-size:25px}
.osub{margin:0;color:var(--muted);line-height:1.9;font-size:14.5px;text-wrap:pretty}
.otype{font-family:var(--verse);font-size:calc(min(23px, 5.8vw) * var(--vf));line-height:2.1;text-align:center;color:#fff;text-shadow:0 2px 26px rgba(0,0,0,.6);text-wrap:balance}
.otype .w{display:inline-block;opacity:0;filter:blur(8px);transform:translateY(8px);animation:wd .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes wd{to{opacity:1;filter:blur(0);transform:none}}
.omean{margin:0 auto;max-width:30em;text-align:center;color:#DDD8CE;font-size:14px;line-height:1.95;opacity:0;animation:wd .9s ease forwards}
.obtn{height:54px;font-size:16px;width:100%}
.otype .oh{display:block;text-wrap:balance}
.otype .oh+.oh{margin-top:10px}
.opoet{margin:0;text-align:center;color:rgba(255,255,255,.55);font-size:13px;letter-spacing:.02em;opacity:0;animation:wd .9s ease forwards}
.ohead.one{font-size:21px;font-weight:400;text-align:center;line-height:1.6}
.owel{opacity:0;animation:wd .8s ease forwards}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mtile{position:relative;height:108px;border-radius:20px;overflow:hidden;text-align:right;border:1.5px solid var(--line);background:#0c0c0f;transition:transform .2s,border-color .2s}
.mtile:active{transform:scale(.97)}
.mtile canvas{position:absolute;inset:0;width:100%;height:100%}
.mtile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,12,.05) 10%,rgba(10,10,12,.85))}
.mtile:last-child:nth-child(odd){grid-column:span 2;height:88px}
.mt{position:absolute;right:12px;left:12px;bottom:10px;z-index:1;display:flex;flex-direction:column;gap:1px;color:#fff}
.mt b{font-size:16px;font-weight:600}
.mt small{font-size:11.5px;color:#D4CFC5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck{position:absolute;top:10px;left:10px;z-index:1;width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.55);display:grid;place-items:center;color:transparent;transition:background .2s,border-color .2s}
.ck .i{width:14px;height:14px}
.mtile[aria-pressed="true"]{border-color:var(--acc)}
.mtile[aria-pressed="true"] .ck{background:var(--acc);border-color:var(--acc);color:var(--saffron-ink)}
.oprev{position:relative;border-radius:26px;overflow:hidden;min-height:250px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--line);background:#0c0c0f;flex:none}
.oprev canvas{position:absolute;inset:0;width:100%;height:100%}
.oprev::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 10%,rgba(10,10,12,.88) 68%)}
.oprevin{position:relative;z-index:1;padding:18px;display:flex;flex-direction:column;gap:10px;color:#fff}

<script>
const DATA = {"poets":{"hafez":{"name":"حافظ شیرازی","nick":"حافظ","b":726,"dd":792,"bp":"شیراز","dp":"شیراز","bio":"خواجه شمس‌الدین محمد شیرازی متخلص به «حافظ» و مشهور به «لسان‌الغیب» غزل‌سرای بزرگ و از بزرگان شعر و ادب پارسی است. از زندگانی وی همانند دیگر بزرگان و سخنوران کهن ایرانی به رغم آوازه‌ی بی‌‌مانند او اطلاعات دقیقی در دست نیست و حتی در زمینه نام دقیق وی (محمد یا شمس‌الدین) و خاستگاه وی و سال‌های زندگانی او دیدگاه‌ها همگون و یکسان نی","hue":38},"khayyam":{"name":"خیام نیشابوری","nick":"خیام","b":439,"dd":526,"bp":"نیشابور","dp":"نیشابور","bio":"حکیم ابوالفتح عمربن ابراهیم الخیامی مشهور به «خیام» -فیلسوف و ریاضیدان و منجم و شاعر ایرانی- در سال ۴۳۹ هجری قمری در نیشابور زاده شد. وی در ترتیب رصد ملکشاهی و اصلاح تقویم جلالی همکاری داشت.","hue":200},"saadi":{"name":"سعدی شیرازی","nick":"سعدی","b":615,"dd":694,"bp":"شیراز","dp":"شیراز","bio":"مشرف‌الدین مصلح بن عبدالله شیرازی سراینده نامی و نویسندهٔ بزرگ سده هفتم هجری قمری است. اهل ادب به وی لقب «استادِ سخن»، «پادشاهِ سخن»، «شیخِ اجل» و حتی به گونه مطلق، «استاد» داده‌اند.","hue":150},"moulavi":{"name":"جلال الدین محمد مولوی","nick":"مولانا","b":604,"dd":672,"bp":"بلخ","dp":"","bio":"مولانا جلال‌الدین محمد بلخی، مشهور به مولوی، شاعر، عارف و اندیشمند بزرگ ایرانی، در سال ۶۰۴ هجری قمری (حدود ۵۸۶ هجری شمسی) در شهر بلخ متولد شد. پدرش، بهاءالدین ولد، از عالمان و عارفان نامدار زمان خود بود و نقش مهمی در پرورش علمی و معنوی مولانا داشت.","hue":280},"ferdousi":{"name":"ابوالقاسم فردوسی","nick":"فردوسی","b":329,"dd":411,"bp":"مشهد","dp":"","bio":"حکیم ابوالقاسم فردوسی توسی (زادهٔ ۳۲۹ ه‍.ق، ۳۱۹ ه‍.خ - درگذشتهٔ پیش از ۴۱۱ ه‍.ق، ۳۹۷ ه‍.خ در توس خراسان)، سخن‌سرای نامی ایران و سرایندهٔ شاهنامه حماسهٔ ملی ایرانیان [است]. او را بزرگ‌ترین سرایندهٔ پارسی‌گو دانسته‌اند.","hue":12},"babataher":{"name":"باباطاهر","nick":"باباطاهر","b":429,"dd":499,"bp":"همدان","dp":"همدان","bio":"باباطاهر عریان عارف و سراینده سده پنجم هجری قمری و هم‌روزگار با طغرل شاه سلجوقی است. درباره پیشآمد‌های زندگی و سرگذشت بابا طاهر اطلاعات بسیاری در دست نیست.","hue":95}},"poems":[{"url":"hafez/ghazal/sh1","poet":"hafez","title":"غزل شمارهٔ ۱","sum":"در این شعر حافظ از عشق و چالش‌های آن سخن می‌گوید. او از ساقی می‌خواهد که جامی پر کند و به او بدهد زیرا عشق در ابتدا آسان به نظر می‌رسد، امّا بعد با دشواری همراه می‌شود. حافظ آسایش را در این دنیا و زیر سایهٔ مرگ نشدنی می‌داند. او ما را به پیروی از رهنمودهای پیر مغان دعوت می‌کند. در پایان، او به اهمیّت بودن در پیشگاه معشوق و غفلت‌نورزیدن از او اشاره می‌کند و می‌گوید دنیا را برای آنکه دوست داری رها کن.","sumAi":0,"metre":"مفاعیلن مفاعیلن مفاعیلن مفاعیلن (هزج مثمن سالم)","rhyme":"لها","fmt":"Ghazal","total":7,"c":[["اَلا یا اَیُّهَا السّاقی اَدِرْ کَأسَاً و ناوِلْها","که عشق آسان نمود اوّل ولی افتاد مشکل‌ها","ای ساقی! جامی را (بین حاضران) بگردان و شرابش را بر ما بنوشان، که عشق در آغاز آسان به نظر آمد اما پر از دشواری‌ها بود.",0],["به بویِ نافه‌ای کآخِر صبا زان طُرّه بُگشاید","ز تابِ جَعدِ مشکینش چه خون افتاد در دل‌ها","در آرزوی آن که باد بوی عطری از موهای او بیاورد، از تاب خوردن موهای او چقدر دل‌ها خون شد.",0],["مرا در منزلِ جانان چه امنِ عیش، چون هر دَم","جَرَس فریاد می‌دارد که بَربندید مَحمِل‌ها","من در خانه جانانم چه آرامش خوشی کردن دارم هنگامی که هر دم زنگِ کاروان فریاد می‌زند که بارها را بر کجاوه‌ها ببندید.",0],["به مِی سجّاده رنگین کُن گَرَت پیرِ مُغان گوید","که سالِک بی‌خبر نَبْوَد ز راه و رسمِ منزل‌ها","اگر پیر مغان به تو بگوید که جانمازت را با شراب آلوده کن، این کار را بکن؛ چرا که رهرو از راه و روش و آداب خانه و جایگاه ها ناآگاه نیست.",0],["شبِ تاریک و بیمِ موج و گِردابی چنین هایل","کجا دانند حالِ ما سبک‌بارانِ ساحل‌ها؟","در شبی تاریک در بیم موج دریا و گردابی چنین سهمگین؛ کسانی که سبک بار(آسوده یا با بار و بندیل سبک)ها بر کنار خشکی ساحل ها اند، حال ما را از کجا می دانند؟",0],["همهْ کارم ز خودکامی به بدنامی کشید آخر","نهان کِی مانَد آن رازی کَزو سازند مَحفل‌ها؟","همه کارم از به دنبال رسیدن به خواسته دل خودم، سرانجام به بدنامی کشید؛ کی رازی که دورهمی‌هایی برای بحث در مورد آن تشکیل می‌شود پنهان می‌ماند؟",0],["حضوری گر همی خواهی از او غایب مشو حافظ","مَتیٰ ما تَلْقَ مَنْ تَهْوی   bindTop(box.lastElementChild, box, st);

function fling(card, dir, box, st){
  card.style.transition = 'transform .32s ease-in, opacity .32s';
  card.style.transform = `translateX(${dir * 135}%) rotate(${dir * 20}deg)`; card.style.opacity = '0';
  const k = card.dataset.k;
  setTimeout(() => {
    if (dir > 0) { if (!isSaved(k)) toggleSave(k); else toast('قبلاً توی دیوانت بود'); }
    markSeen(k); S.hinted = true; save(); st.idx++; box.parentElement.querySelector('.deckhint')?.remove(); drawDeck(box, st);
  }, 300);
}
function bindTop(card, box, st){
  const [u, i] = card.dataset.k.split('#');
  let sx = 0, sy = 0, dx = 0, down = false, lens = false, holdT = 0;
  const moveLens = e => { const r = card.getBoundingClientRect(); card.style.setProperty('--lx', (e.clientX - r.left) + 'px'); card.style.setProperty('--ly', (e.clientY - r.top) + 'px'); };
  card.addEventListener('pointerdown', e => {
    if (e.target.closest('button')) return;
    down = true; sx = e.clientX; sy = e.clientY; dx = 0; card.style.transition = 'none';
    try { card.setPointerCapture(e.pointerId); } catch (_) {}
    holdT = setTimeout(() => { if (Math.abs(dx) < 8) { lens = true; card.classList.add('lensing'); moveLens(e); } }, 300);
  });
  card.addEventListener('pointermove', e => {
    if (!down) return; if (lens) return moveLens(e);
    dx = e.clientX - sx; if (Math.abs(dx) > 8 || Math.abs(e.clientY - sy) > 8) clearTimeout(holdT);
    card.style.transform = `translateX(${dx}px) rotate(${dx / 18}deg)`;
    card.dataset.dir = dx > 40 ? 'keep' : dx < -40 ? 'pass' : '';
  });
  const up = e => {
    if (!down) return; down = false; clearTimeout(holdT);
    if (lens) { lens = false; card.classList.remove('lensing'); return; }
    card.style.transition = '';
    if (Math.abs(dx) > 90) return fling(card, dx > 0 ? 1 : -1, box, st);
    card.style.transform = ''; card.dataset.dir = '';
    if (e.type === 'pointerup' && Math.abs(dx) < 6 && Math.abs(e.clientY - sy) < 6) openPoem(u, {focus:+i});
  };
  card.addEventListener('pointerup', up); card.addEventListener('pointercancel', up);
  card.querySelector('[data-act="keep"]').onclick = () => fling(card, 1, box, st);
  card.querySelector('[data-act="pass"]').onclick = () => fling(card, -1, box, st);
  card.querySelector('[data-act="open"]').onclick = () => openPoem(u, {focus:+i});
  card.querySelector('[data-act="share"]').onclick = () => openShare(u, +i);
  card.querySelector('[data-act="eye"]').onclick = () => card.classList.toggle('painted');
}

function setPage(i){

  const fm = $('#f-mean');

  fm.hidden = !r; if (r) fm.querySelector('span').textContent = r.classList.contains('on') ? 'بستن معنی' : 'یعنی چی؟';
}
function goPage(i, instant){
  const n = P[R.url].c.length; i = Math.max(0, Math.min(n, i));

}

function closePoem(){ const el = $('#reader'); el.classList.remove('on'); el.setAttribute('aria-hidden', 'true'); stopPlayer(); if (cur === 'today') renderToday(); if (cur === 'lib') renderLib(); }
function togglePlay(){
  const p = P[player.url], tm = poemTiming(p);
  if (player.playing) { stopPlayer(); return; }
  if (player.t >= tm[tm.length - 1]) player.t = tm[0];
  player.playing = true; player.last = performance.now();
  if (!S.silentNote) { S.silentNote = true; save(); toast('پیش‌نمایش بی‌صداست، ولی زمان‌بندی همون خوانش واقعیه'); }
  const step = now => {
    if (!player.playing) return;
    player.t += now - player.last; player.last = now;
    if (player.t >= tm[tm.length - 1]) { player.t = tm[tm.length - 1]; stopPlayer(); syncUI(); toast('تموم شد'); return; }
    syncUI(); player.raf = requestAnimationFrame(step);
  };
  player.raf = requestAnimationFrame(step); syncUI();
}
function stopPlayer(){ player.playing = false; cancelAnimationFrame(player.raf); const b = $('#r-pp'); if (b) b.innerHTML = ICON_PLAY; document.querySelectorAll('.mis.on').forEach(m => m.classList.remove('on')); lastK = -1; }
let lastK = -1;
function syncUI(){
  const p = P[player.url]; if (!p || !$('#r-bar')) return;
  const tm = poemTiming(p), t0 = tm[0], end = tm[tm.length - 1];
  $('#r-bar').style.width = ((player.t - t0) / (end - t0) * 100) + '%';
  $('#r-t').textContent = mmss(player.t - t0);
  $('#r-pp').innerHTML = player.playing ? ICON_PAUSE : ICON_PLAY;
  $('#r-pp').setAttribute('aria-label', player.playing ? 'توقف' : 'پخش');
  if (!player.playing) return;
  let k = 0; for (let j = 0; j < tm.length - 1; j++) if (player.t >= tm[j]) k = j;
  if (k !== lastK) {
    lastK = k;
    document.querySelectorAll('#reader .mis.on').forEach(m => m.classList.remove('on'));
    document.querySelectorAll(`#reader .mis[data-k="${k}"]`).forEach(m => m.classList.add('on'));
    if (k % 2 === 0) {
      if (R && R.layout === 'focus') goPage(k / 2);
      else { const c = document.querySelector(`#r-list .mis[data-k="${k}"]`)?.closest('.cpl'), lw = $('#r-list'); if (c && lw) { const lr = lw.getBoundingClientRect(), cr = c.getBoundingClientRect(); lw.scrollBy({top: (cr.top - lr.top) - (lr.height - cr.height) / 2, behavior:'smooth'}); } }
    }
  }
}

  </div>`;
  const h = $('#hold'); let p = 0, raf = 0, t0 = 0, down = false;
  const tick = now => { if (!down) return; p = Math.min(1, (now - t0) / 1500); const fp = FALF ? Math.max(0, Math.min(1, (now - t0 - 350) / 1500)) : 1;
    h.style.setProperty('--p', FALF ? (p + fp) / 2 : p); if (FALF) { $('#fb-me').style.width = p * 100 + '%'; $('#fb-f').style.width = fp * 100 + '%'; }
    if (p >= 1 && fp >= 1) { down = false; showFal(); return; } raf = requestAnimationFrame(tick); };
  const start = e => { e.preventDefault(); down = true; t0 = performance.now(); raf = requestAnimationFrame(tick); };
  const end = () => { if (!down) return; down = false; cancelAnimationFrame(raf); h.style.setProperty('--p', 0); if (FALF) { $('#fb-me').style.width = '0'; $('#fb-f').style.width = '0'; } toast(FALF ? 'با هم تا آخر نگه دارید' : 'تا آخر نگه دار'); };
  h.addEventListener('pointerdown', start); h.addEventListener('pointerup', end); h.addEventListener('pointerleave', end); h.addEventListener('pointercancel', end);

      <div class="ofoot"><button class="btn primary obtn" data-next>${label()}</button></div></div>`;
    o.querySelectorAll('[data-v]').forEach(b => b.onclick = () => { const k = b.dataset.v; sel.has(k) ? sel.delete(k) : sel.add(k); S.vibes = [...sel]; save(); b.setAttribute('aria-pressed', sel.has(k)); o.querySelector('[data-next]').textContent = label(); });

      <div style="display:flex;flex-direction:column;gap:10px"><h2 class="h2">حال‌وهوا</h2>
        <div class="shelf">${MOODS.map(themeCard).join('')}</div></div>
      <div style="display:flex;flex-direction:column;gap:10px"><h2 class="h2">امتحان کن</h2>

const LMAP = {'ئ':'ی', 'ؤ':'و', 'ء':'', 'ة':'ه', 'ي':'ی', 'ك':'ک'};

function newGame(f){ const g = {id:'g' + Date.now(), f, score:[0, 0], moves:[], turn:'me'}; SOC.games.unshift(g); const t = dmThread(f); t.msgs.push({w:'me', type:'game', g:g.id, at:'الان'}); t.ts = Date.now(); t.t = 'الان'; openGame(g.id); }
async function openGame(id){

function bubble(m){
  const [u, i] = m.k.split('#'), p = P[u], c = p.c[+i];
  return `<div class="mb ${m.w}"><span class="mbl">${m.w === 'me' ? 'تو' : FRIENDS[G.f].n} · از «${esc(startL(m.k))}»</span><div class="mbv">${esc(c[0])}<br>${esc(c[1])}</div><span class="mbm">${esc(poet(p.poet).nick)} · ${esc(p.title)}<i>«${esc(endL(m.k))}»</i></span></div>`;
}
function drawThread(){
  const th = $('#gm-thread');
  th.innerHTML = `<div class="gth"><p class="note" style="text-align:center;margin:0">هر بیت باید با حرف آخرِ بیت قبلی شروع بشه. بیت تکراری قبول نیست.</p>${G.moves.map(bubble).join('')}${G.turn.startsWith('them') ? `<div class="mb them typing"><span class="dots"><i></i><i></i><i></i></span><small>${FRIENDS[G.f].n} داره دنبال بیت می‌گرده…</small></div>` : ''}</div>`;
  $('#gm-score').textContent = `${fa(G.score[0])} : ${fa(G.score[1])}`;
  th.scrollTop = th.scrollHeight;
}
function drawPanel(){
  const pn = $('#gm-panel'), used = new Set(G.moves.map(m => m.k));
  if (G.turn !== 'me') { pn.innerHTML = ''; return; }
  const last = G.moves[G.moves.length - 1], L = last ? endL(last.k) : null;
  let pool = L ? candidates(L, used) : DECK.map(([u, i]) => u + '#' + i).filter(k => !used.has(k));
  let shown = pool.slice().sort(() => Math.random() - .5).slice(0, 6), sel = null;
  const draw = (q = '') => {
    const list = q ? pool.filter(k => { const [u, i] = k.split('#'); const c = P[u].c[+i]; return norm(c[0] + ' ' + c[1]).includes(norm(q)); }).slice(0, 6) : shown;
    pn.innerHTML = `<div class="gpin">
      <div class="row" style="flex-wrap:nowrap;gap:12px">${L ? `<span class="bigL">${esc(L)}</span>` : ''}<div style="display:flex;flex-direction:column;gap:2px"><b>نوبت توئه</b><small class="muted">${L ? `بیتی که با «${esc(L)}» شروع بشه · ${fa(pool.length)} بیت پیدا شد` : 'بازی رو با هر بیتی که دوست داری شروع کن'}</small></div></div>
      <label class="sfield">${icon('search')}<input id="gm-q" type="search" placeholder="یه کلمه که یادته…" value="${esc(q)}" autocomplete="off"></label>
      <div class="gsug">${list.length ? list.map(k => { const [u, i] = k.split('#'), p = P[u], c = p.c[+i]; return `<button class="gopt" data-k="${k}" aria-pressed="${sel === k}"><span class="mbv">${esc(c[0])}<br>${esc(c[1])}</span><small>${esc(poet(p.poet).nick)} · به «${esc(endL(k))}» ختم می‌شه</small></button>`; }).join('') : '<div class="empty" style="padding:14px">بیتی با این کلمه پیدا نشد.</div>'}</div>
      <div class="row"><button class="btn primary grow" id="gm-send" ${sel ? '' : 'disabled style="opacity:.45"'}>بفرست</button><button class="btn" id="gm-more">پیشنهاد دیگه</button></div>
    </div>`;
    const qi = $('#gm-q'); qi.oninput = () => { const pos = qi.selectionStart; draw(qi.value); const n = $('#gm-q'); n.focus(); try { n.setSelectionRange(pos, pos); } catch(_) {} };
    pn.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { sel = b.dataset.k; draw($('#gm-q').value); });
    $('#gm-more').onclick = () => { shown = pool.slice().sort(() => Math.random() - .5).slice(0, 6); sel = null; draw(); };
    $('#gm-send').onclick = () => { if (!sel) return; G.moves.push({w:'me', k:sel}); G.score[0]++; G.turn = 'them'; markSeen(sel); drawThread(); drawPanel(); friendMove(1800); };
  };
  draw();
}
function friendMove(delay){
  drawThread(); $('#gm-panel').innerHTML = '';
  const g = G;
  setTimeout(() => {
    if (G !== g || !$('#gamescreen').classList.contains('on')) { g.turn = 'me'; const last = g.moves[g.moves.length - 1]; const c = candidates(endL(last.k), new Set(g.moves.map(m => m.k))); if (c.length) { g.moves.push({w:'them', k:pick(c)}); g.score[1]++; } const t = dmThread(g.f); if (!(chatOpen() && CF === g.f)) t.unread = true; t.ts = Date.now(); t.t = 'الان'; if (chatOpen()) drawChat(); if (dmsOpen()) drawDMs(); updateBadge(); return; }
    const last = g.moves[g.moves.length - 1], used = new Set(g.moves.map(m => m.k)), c = candidates(endL(last.k), used);
    if (c.length) { g.moves.push({w:'them', k:pick(c)}); g.score[1]++; }
    else { g.score[0]++; toast(`${FRIENDS[g.f].n} کم آورد! یه امتیاز برای تو`); }
    g.turn = 'me'; drawThread(); drawPanel();
  }, delay);
}

  const sendText = () => { const x = inp.value.trim(); if (!x) return; inp.value = ''; snd.hidden = true; chatSend({type:'text', x}); };
  snd.onclick = sendText; inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); sendText(); } };
  $('#ch-beyt').onclick = () => pickBeyt(f, k => chatSend({type:'beyt', k}));
  drawChat();
}
function msgHTML(m, j){
  const r = m.react ? `<span class="react" aria-label="پسندید">${icon('heart')}</span>` : '';
  if (m.type === 'text') return `<div class="cm ${m.w}" data-j="${j}"><div class="cb ${m.w}">${esc(m.x)}</div>${r}</div>`;
  if (m.type === 'beyt') { const [u, i] = m.k.split('#'), p = P[u], c = p.c[+i], sc = sceneFor(u, +i);
    return `<div class="cm ${m.w}" data-j="${j}"><button class="cbeyt" data-k="${m.k}">${artCanvas('cba', sc, c[0] + ' ' + c[1], SCENE_HUE[sc] ?? 30)}<span class="cbin"><span class="v">${esc(c[0])}<br>${esc(c[1])}</span><small>${esc(poet(p.poet).nick)} · ${esc(p.title)}</small></span></button>${r}</div>`; }
  if (m.type === 'game') { const g = SOC.games.find(x => x.id === m.g), mine = gameMine(g), last = g.moves[g.moves.length - 1];
    return `<div class="cm ${m.w}" data-j="${j}"><button class="gcard ccard" data-game="${g.id}"><span class="gl">${g.turn === 'me' && last ? esc(endL(last.k)) : icon('chat')}</span><span class="gm"><b>مشاعره</b><small>${mine ? 'نوبت توئه' : `منتظر ${FRIENDS[g.f].n}`}</small></span><span class="gs">${fa(g.score[0])} : ${fa(g.score[1])}</span>${mine ? '<i class="dot"></i>' : ''}</button></div>`; }
  if (m.type === 'fal') return `<div class="cm ${m.w}" data-j="${j}"><button class="duo ccard" data-fal="1"><span class="gl fl">${icon('fal')}</span><span class="gm"><b>فال دونفره</b><small>${m.w === 'me' ? 'یه نیت مشترک پیشنهاد دادی' : `${FRIENDS[CF].n} یه نیت مشترک پیشنهاد داد`}</small></span>${icon('fwd')}</button></div>`;
  return '';
}
function drawChat(){
  const t = SOC.dm[CF], th = $('#ch-th'); if (!th) return;
  let lastAt = null; const n = t.msgs.length;
  th.innerHTML = `<div class="cth"><div class="chead">${fav(CF, 68)}<b>${FRIENDS[CF].n}</b><small>دوستت توی بیت</small></div>${t.msgs.map((m, j) => {
      let h = ''; if (m.at && m.at !== lastAt) { h += `<span class="cday">${m.at}</span>`; lastAt = m.at; }
      return h + msgHTML(m, j) + (j === n - 1 && m.w === 'me' && t.seen ? '<span class="cseen">دیده شد</span>' : '');
    }).join('')}${t.typing ? `<div class="cm them"><div class="cb them typing"><span class="dots"><i></i><i></i><i></i></span></div></div>` : ''}
    ${n < 6 ? '<p class="note chint">روی هر پیام دو بار بزن تا بپسندیش.</p>' : ''}</div>`;
  lazyArt(th);
  let tapT = null, tapEl = null;
  th.querySelectorAll('.cm[data-j]').forEach(el => {
    const j = +el.dataset.j, m = t.msgs[j];
    el.onclick = e => {
      if (tapEl === el && tapT) { clearTimeout(tapT); tapT = null; tapEl = null; if (m.w === 'them') { m.react = !m.react; drawChat(); } return; }
      tapEl = el; clearTimeout(tapT);
      tapT = setTimeout(() => { tapT = null; tapEl = null;
        if (m.type === 'beyt') { const [u, i] = m.k.split('#'); openPoem(u, {focus:+i}); }
        if (m.type === 'game') openGame(m.g);
        if (m.type === 'fal') openFal(CF);
      }, 260);
    };
  });
  requestAnimationFrame(() => { th.scrollTop = th.scrollHeight; }); setTimeout(() => { th.scrollTop = th.scrollHeight; }, 60);
}
const R_BEYT = ['وای، این دقیقاً حال امروزم بود', 'ذخیره‌ش کردم توی دیوانم', 'اینو نخونده بودم. مرسی که فرستادی', 'چقدر خوب بود این'];
const R_TEXT = ['آره واقعاً', '😄', 'باشه، بعداً یه بیت برات می‌فرستم', 'موافقم'];
function chatSend(m){
  const f = CF, t = dmThread(f); const msg = {...m, w:'me', at:'الان'};
  t.msgs.push(msg); t.ts = Date.now(); t.t = 'الان'; t.seen = false;
  if (m.type === 'beyt') markSeen(m.k);
  drawChat(); friendReact(f, msg);
}
function friendReact(f, msg){
  const t = dmThread(f); clearTimeout(t._a); clearTimeout(t._b);
  const here = () => chatOpen() && CF === f;
  t._a = setTimeout(() => {
    t.seen = true; if (msg.type === 'beyt' && Math.random() < .7) msg.react = true; t.typing = true; if (here()) drawChat();
    t._b = setTimeout(() => {
      t.typing = false; t.msgs.push({w:'them', type:'text', x:pick(msg.type === 'beyt' ? R_BEYT : R_TEXT), at:'الان'}); t.ts = Date.now(); t.t = 'الان';
      if (here()) drawChat(); else { t.unread = true; if (dmsOpen()) drawDMs(); if (cur === 'friends' && !chatOpen()) renderFriends(); updateBadge(); }
    }, 2300);
  }, 1300);
}
function pickBeyt(f, cb){
  const saved = (S.saved || []).filter(k => P[k.split('#')[0]]);
  let pool = [...new Set([...saved, ...DECK.map(([u, i]) => u + '#' + i), ...MOODS.flatMap(m => m.items.map(([u, i]) => u + '#' + i))])], sel = null;
  const draw = (q = '') => {
    const src = q ? [...new Set([...pool, ...[...new Set([...poems, ...LIB.poems])].flatMap(p => p.c.map((c, i) => p.url + '#' + i)).slice(0, 4000)])] : pool;
    const list = (q ? src.filter(k => { const [u, i] = k.split('#'); const c = P[u] && P[u].c[+i]; return c && norm(c[0] + ' ' + c[1]).includes(norm(q)); }) : src).slice(0, 8);
    openSheet(`<b style="font-size:17px">یه بیت برای ${FRIENDS[f].n}</b>
      <label class="sfield">${icon('search')}<input id="pb-q" type="search" placeholder="یه کلمه که یادته…" value="${esc(q)}" autocomplete="off"></label>
      ${q ? '' : `<p class="note" style="margin:0">${saved.length ? 'اول نگه‌داشته‌هات، بعد پیشنهادهای امروز' : 'پیشنهادهای امروز'}</p>`}
      <div class="gsug col">${list.length ? list.map(k => { const [u, i] = k.split('#'), p = P[u], c = p.c[+i]; return `<button class="gopt" data-k="${k}" aria-pressed="${sel === k}"><span class="mbv">${esc(c[0])}<br>${esc(c[1])}</span><small>${esc(poet(p.poet).nick)} · ${esc(p.title)}${isSaved(k) ? ' · نگه‌داشته' : ''}</small></button>`; }).join('') : '<div class="empty" style="padding:14px">بیتی با این کلمه پیدا نشد.</div>'}</div>
      <button class="btn primary" id="pb-go" ${sel ? '' : 'disabled style="opacity:.45"'}>${icon('send')}بفرست</button>`,
      sh => {
        const qi = $('#pb-q'); qi.onchange = () => draw(qi.value); qi.onkeydown = e => { if (e.key === 'Enter') draw(qi.value); };
        sh.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { sel = b.dataset.k; draw($('#pb-q').value); });
        $('#pb-go').onclick = () => { if (!sel) return; closeSheet(); cb(sel); };
      });
  };
  draw();
}

    <div class="dgrid">${d.items.map((k, j) => { const [u, i] = k.split('#'), c = P[u].c[+i], sc = sceneFor(u, +i), who = j === 0 ? 'تو' : FRIENDS[d.with[(j - 1) % d.with.length]].n;
      return `<button class="dtile" data-k="${k}">${artCanvas('dta', sc, c[0] + c[1], SCENE_HUE[sc] ?? 30)}<span class="dti"><b>${esc(c[0])}</b><small>${who} اضافه کرد</small></span></button>`; }).join('')}</div>
    <p class="note" style="margin:0">از هر بیتی، با «به دیوان مشترک» اینجا اضافه‌ش کن.</p>`,
    sh => { lazyArt(sh); sh.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const [u, i] = b.dataset.k.split('#'); closeSheet(); openPoem(u, {focus:+i}); }); });
}
function addToDiwan(k){
  openSheet(`<b style="font-size:17px">به کدوم دیوان مشترک؟</b><div>${SOC.diwans.map(d => `<button class="song" style="width:100%;text-align:right" data-d="${d.id}"><span class="cov">${icon('book')}</span><div><b>${esc(d.t)}</b><small>${fa(d.items.length)} بیت · با ${d.with.map(w => FRIENDS[w].n).join(' و ')}</small></div></button>`).join('')}</div>`,

}
