name: Yebeyt
options:
  bundleIdPrefix: com.yebeyt
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fa
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: 2.0.0
    CURRENT_PROJECT_VERSION: 1
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Yebeyt:
    type: application
    platform: iOS
    sources:
      - path: Yebeyt
      - path: ../../assets/fonts
        includes:
          - Lalezar-Regular.ttf
          - Vazirmatn.ttf
          - Parastoo-Bold.ttf
          - Parastoo.ttf
        buildPhase: resources
    info:
      path: Yebeyt/Info.plist
      properties:
        CFBundleDisplayName: یه بیت
        CFBundleDevelopmentRegion: fa
        CFBundleLocalizations: [fa]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - Lalezar-Regular.ttf
          - Vazirmatn.ttf
          - Parastoo-Bold.ttf
          - Parastoo.ttf
        UIUserInterfaceStyle: Light
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
  YebeytTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: YebeytTests
    dependencies:
      - target: Yebeyt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yebeyt.app.tests
        GENERATE_INFOPLIST_FILE: YES
  YebeytUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [YebeytUITests]
    dependencies:
      - target: Yebeyt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yebeyt.app.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Yebeyt:
    build:
      targets:
        Yebeyt: all
        YebeytTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - YebeytTests
        - YebeytUITests
